name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tagged commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: oven-sh/setup-bun@v2

      - name: Check versions match the tag
        run: bun scripts/release.ts --check
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Install workspace
        run: bun install

      - name: Test and typecheck
        run: |
          for dir in packages/@buntal/http packages/buntal packages/@buntal/cli packages/create-buntal; do
            echo "::group::$dir"
            (cd "$dir" && bunx tsc --noEmit -p . && bun test --pass-with-no-tests)
            echo "::endgroup::"
          done

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install workspace
        run: bun install

      - name: Publish to npm
        run: bun scripts/release.ts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

  changelog:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
